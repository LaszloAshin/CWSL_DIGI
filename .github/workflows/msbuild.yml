name: MSBuild

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: source

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

#    - name: Restore NuGet packages
#      working-directory: ${{env.GITHUB_WORKSPACE}}
#      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.14.2'
        cache: true

    - name: list qt includes
      run: dir ${{env.QT_ROOT_DIR}}\include

    - name: Create MSBuild props for extra include paths
      run: |
        echo ^<Project^> > MyIncludes.props
        echo   ^<ItemDefinitionGroup Condition="'$$(Configuration)|$$(Platform)'=='${{env.BUILD_CONFIGURATION}}|Win32'"^> >> MyIncludes.props
        echo     ^<ClCompile^> >> MyIncludes.props
        echo       ^<AdditionalIncludeDirectories^>${{env.QT_ROOT_DIR}}\include;${{env.QT_ROOT_DIR}}\include\QtCore;%%(AdditionalIncludeDirectories)^</AdditionalIncludeDirectories^> >> MyIncludes.props
        echo     ^</ClCompile^> >> MyIncludes.props
        echo   ^</ItemDefinitionGroup^> >> MyIncludes.props
        echo ^</Project^> >> MyIncludes.props
      shell: cmd

    - name: show props file
      run: type MyIncludes.props

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:IncludePath="${{env.QT_ROOT_DIR}}\include" ${{env.SOLUTION_FILE_PATH}}
      shell: cmd
